# ===========================================
# Docker Compose Configuration
# ===========================================
# Runs the API with PostgreSQL database

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dojocountdown-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dojocountdown
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dojocountdown-api
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: 'postgresql://postgres:password@db:5432/dojocountdown?schema=public'
      JWT_ACCESS_SECRET: 'your-super-secret-access-key-change-in-production-min-32-chars'
      JWT_REFRESH_SECRET: 'your-super-secret-refresh-key-change-in-production-min-32-chars'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '7d'
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: 'http://localhost:3000'
      PAYMONGO_SECRET_KEY: '${PAYMONGO_SECRET_KEY}'
      PAYMONGO_PUBLIC_KEY: '${PAYMONGO_PUBLIC_KEY}'
      PAYMONGO_WEBHOOK_SECRET: '${PAYMONGO_WEBHOOK_SECRET}'
      PAYMONGO_PLAN_BOOTSTRAP: '${PAYMONGO_PLAN_BOOTSTRAP}'
      PAYMONGO_PLAN_STARTUP: '${PAYMONGO_PLAN_STARTUP}'
      PAYMONGO_PLAN_ENTERPRISE: '${PAYMONGO_PLAN_ENTERPRISE}'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:
